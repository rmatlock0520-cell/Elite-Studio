<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="studio-token" content="__STUDIO_TOKEN__">
<title>Studio UI - Elite Studio</title>
<link rel="icon" href="../studio.svg">
<!--
  STUDIO UI, the HUD colour theme editor of Elite Studio
  This page is the whole editor. It is shown inside Elite Studio's shell page (..\index.html) and served by Elite Studio's local web server,
  which reads and writes the HUD colour files in your Elite Dangerous folder.
  The app serves the copy of this file that the build puts in its "web" folder: after an edit here, build again
  (or start the app with --web-root pointing at src\web) and reload the page.
-->
<style>
:root{
  --bg:#06080c;--bg2:#0a0e14;--panel:#0e131a;--panel2:#131a23;--panel3:#19212c;
  --line:#1f2935;--line2:#2a3645;--text:#e2e8f0;--muted:#8d99aa;--faint:#5b6677;
  --accent:#ff7100;--accent-ink:#140900;--accent-soft:rgba(255,113,0,.14);--accent-line:rgba(255,113,0,.45);
  --good:#3ddc84;--warn:#ffb020;--bad:#ff5a4f;
  /* each with its free look-alike (the faces below) after the Windows font */
  --font:"Segoe UI","Studio Text",system-ui,-apple-system,sans-serif;
  --hud:"Bahnschrift","DIN Alternate","Studio Heading","Segoe UI","Studio Text",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"Studio Mono","Courier New",monospace;
  color-scheme:dark;
}
/* This page's copy of studio.css's look-alike fonts, for a PC that lacks the Windows ones: only the Linux app carries
   the files (at /fonts/), and each font list names the Windows font first, so Windows draws with its own. */
@font-face{font-family:"Studio Heading";src:url(/fonts/Barlow-Medium.ttf);font-weight:400;size-adjust:102.6%}
@font-face{font-family:"Studio Heading";src:url(/fonts/Barlow-Medium.ttf);font-weight:500;size-adjust:102.6%}
@font-face{font-family:"Studio Heading";src:url(/fonts/Barlow-SemiBold.ttf);font-weight:600;size-adjust:102.6%}
@font-face{font-family:"Studio Heading";src:url(/fonts/Barlow-Bold.ttf);font-weight:700;size-adjust:102.6%}
@font-face{font-family:"Studio Heading";src:url(/fonts/DINishDigits-500.ttf);font-weight:400;unicode-range:U+0030-0039;size-adjust:102.8%}
@font-face{font-family:"Studio Heading";src:url(/fonts/DINishDigits-500.ttf);font-weight:500;unicode-range:U+0030-0039;size-adjust:102.8%}
@font-face{font-family:"Studio Heading";src:url(/fonts/DINishDigits-610.ttf);font-weight:600;unicode-range:U+0030-0039;size-adjust:102.8%}
@font-face{font-family:"Studio Heading";src:url(/fonts/DINishDigits-720.ttf);font-weight:700;unicode-range:U+0030-0039;size-adjust:102.8%}
@font-face{font-family:"Studio Text";src:url(/fonts/selawk.ttf);font-weight:400;ascent-override:107.91%;descent-override:25.1%;line-gap-override:0%}
@font-face{font-family:"Studio Text";src:url(/fonts/selawksb.ttf);font-weight:600;size-adjust:98%;ascent-override:107.91%;descent-override:25.1%;line-gap-override:0%}
@font-face{font-family:"Studio Text";src:url(/fonts/selawkb.ttf);font-weight:700;ascent-override:107.91%;descent-override:25.1%;line-gap-override:0%}
@font-face{font-family:"Studio Mono";src:url(/fonts/CascadiaMono.ttf);font-weight:200 700}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--font);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.topbar{height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0c1118,#080b10)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:26px;height:26px;flex:none}
.brand b{font-family:var(--hud);font-weight:600;letter-spacing:.16em;font-size:16px;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;min-width:0;flex:1}
.chip{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px;white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.chip.on .dot{background:var(--good);box-shadow:0 0 8px var(--good)}
.chip.warn{border-color:rgba(255,176,32,.55);color:#ffd27a;cursor:pointer;background:rgba(255,176,32,.08)}
.chip.warn .dot{background:var(--warn)}
.chip.bad{border-color:rgba(255,90,79,.55);color:#ffb3ad}
.chip.bad .dot{background:var(--bad)}
.actions{display:flex;align-items:center;gap:8px}

.btn{height:34px;padding:0 14px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent-line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.12)}
.btn.icon{width:34px;padding:0;font-size:17px}
.btn.small{height:28px;padding:0 10px;font-size:13px}
.btn.danger{border-color:rgba(255,90,79,.5);color:#ffb3ad}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.28);font-size:12px;display:inline-grid;place-items:center}
.switch{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer;user-select:none;white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--panel3);border:1px solid var(--line2);position:relative;margin:0;cursor:pointer;transition:.15s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:.15s}
.switch input:checked{background:var(--accent-soft);border-color:var(--accent)}
.switch input:checked::after{left:16px;background:var(--accent)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 480px;height:calc(100vh - 58px)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:14px;gap:10px}
.preview{position:relative;flex:1;min-height:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#020305}
#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud text{font-family:var(--hud)}
#partpic{position:absolute;right:12px;bottom:12px;margin:0;padding:6px;border:1px solid var(--line2);border-radius:8px;background:rgba(8,10,14,.94);box-shadow:0 6px 24px rgba(0,0,0,.6);pointer-events:none;max-width:46%}
#partpic[hidden]{display:none}
#partpic img{display:block;width:405px;max-width:100%;border-radius:4px}
#partpic figcaption{margin-top:5px;font-size:12px;color:var(--muted);max-width:405px}
.el .tested{color:#8fd0a0;font-size:12px;margin-top:3px}
#hud [data-id]{cursor:pointer;transition:opacity .12s}
#hud.focus [data-id]:not(.hl){opacity:.14}
.stagebar{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;min-height:34px}
.stagebar .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stagebar .label b{color:var(--text);font-weight:600}
.views{display:flex;gap:6px;flex-wrap:wrap}
.views button{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-family:var(--hud);letter-spacing:.04em;font-size:13px}
.views button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.compare-note{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(6,8,12,.85);border:1px solid var(--line2);border-radius:999px;padding:5px 14px;font-size:12.5px;color:var(--text);pointer-events:none}

.panel{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;background:none;padding:10px 11px;border-bottom:2px solid transparent;color:var(--muted);font-family:var(--hud);letter-spacing:.06em;font-size:13.5px;white-space:nowrap}
.tabs button.active{color:var(--text);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--text)}
.tabbody{flex:1;overflow:auto;padding:16px}

h2{font-family:var(--hud);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:14px;margin:0 0 10px}
h3{font-family:var(--hud);font-weight:600;letter-spacing:.06em;font-size:12.5px;margin:20px 0 8px;color:var(--muted);text-transform:uppercase}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card.note{border-color:rgba(255,176,32,.4);background:rgba(255,176,32,.06)}
.card.bad{border-color:rgba(255,90,79,.45);background:rgba(255,90,79,.06)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.steps div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;color:var(--muted)}
.steps b{display:block;color:var(--text);font-family:var(--hud);letter-spacing:.04em;font-size:13px;margin-bottom:2px}
.palettes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pal{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);text-align:left;font-size:13px}
.pal:hover{border-color:var(--accent-line)}
.sw{display:flex;flex:none}
.sw i{width:12px;height:22px;display:block}
.sw i:first-child{border-radius:4px 0 0 4px}
.sw i:last-child{border-radius:0 4px 4px 0}
.role{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.role:last-child{border-bottom:0}
.role .name{font-weight:600}
.role .desc{color:var(--muted);font-size:12.5px}
.role .n{color:var(--faint);font-size:12px;white-space:nowrap}
input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line2);border-radius:7px;background:none;cursor:pointer;flex:none}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
.checks{display:grid;gap:9px;margin:14px 0}
.checks label{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:13px;cursor:pointer}
.checks input{margin-top:3px;accent-color:var(--accent)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}

.search{width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);outline:none}
.search:focus{border-color:var(--accent)}
.toolrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.groups button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);font-size:12.5px}
.groups button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.groups button .c{color:var(--faint);margin-left:5px}
.cat{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.cat>header{padding:9px 12px;font-family:var(--hud);letter-spacing:.05em;font-size:13px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.cat>header span{color:var(--faint);font-family:var(--font);letter-spacing:0;font-size:12px}
.el{padding:9px 12px;border-bottom:1px solid var(--line)}
.el:last-child{border-bottom:0}
.el.flash,.role.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.el .top{display:flex;align-items:center;gap:10px;min-height:32px}
.el .t{flex:1;min-width:0;font-size:13.5px}
.dirty{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:7px;vertical-align:middle}
.el .d{color:var(--muted);font-size:12px;margin-top:3px;white-space:pre-line}
.el .d.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.hex{width:80px;height:30px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--mono);font-size:12.5px;text-transform:uppercase}
.el select{height:30px;max-width:220px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);padding:0 6px}
.el input[type=range]{width:130px;accent-color:var(--accent)}
.num{width:66px;height:30px;padding:0 6px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);font-family:var(--mono);font-size:12.5px}
.alpha{display:flex;align-items:center;gap:8px;margin-top:6px;color:var(--muted);font-size:12px}
.alpha input{width:150px;accent-color:var(--accent)}
.reset{border:0;background:none;color:var(--faint);width:26px;height:26px;border-radius:6px;flex:none;font-size:15px}
.reset:hover{color:var(--text);background:var(--panel3)}
.reset.off{visibility:hidden}
.reset.def{width:auto;padding:0 7px;font-size:11.5px;border:1px solid var(--line2)}
.reset.def.off{display:none}
.modenote{margin-top:6px;font-size:12px;color:#ffd27a}
.linkbtn{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:12px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:6px 8px;align-items:center;font-size:12.5px;margin:10px 0}
.matrix .num{width:100%}
.swatch{display:inline-block;width:18px;height:18px;border-radius:4px;vertical-align:middle;border:1px solid rgba(255,255,255,.15)}

.themes-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.theme{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);text-align:left;padding:0;display:flex;flex-direction:column}
.theme:hover{border-color:var(--accent-line)}
.theme img,.theme .noimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#05070a}
.theme .meta{padding:8px 10px}
.theme .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.theme .au{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:6px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.15)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:9px}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.badge.good{color:var(--good);border-color:rgba(61,220,132,.4)}
.badge.warn{color:var(--warn);border-color:rgba(255,176,32,.45)}
.badge.bad{color:var(--bad);border-color:rgba(255,90,79,.45)}
.log{font-family:var(--mono);font-size:12px;background:#05070a;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;color:#b9c4d2;max-height:240px;overflow:auto;margin-top:10px}
.field{display:flex;gap:8px;margin-top:8px}
.field input{flex:1;min-width:0;height:34px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#141b25;border:1px solid var(--line2);border-left:3px solid var(--accent);padding:11px 16px;border-radius:9px;box-shadow:0 12px 30px rgba(0,0,0,.5);transition:.2s;max-width:min(580px,92vw);z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.bad{border-left-color:var(--bad)}
#toast.good{border-left-color:var(--good)}
.modal{position:fixed;inset:0;background:rgba(2,4,8,.72);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{width:min(540px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:18px 18px 16px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.modal .body{color:var(--muted);margin:8px 0 18px}
.modal .body ul{margin:8px 0;padding-left:18px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px}
.cover{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:70;padding:24px}
.cover .box{max-width:580px}
.banner{position:fixed;top:58px;left:0;right:0;z-index:40;background:#2a0f0d;border-bottom:1px solid rgba(255,90,79,.5);color:#ffd3cf;padding:9px 16px;font-size:13px;display:flex;gap:12px;align-items:center}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:1100px){
  body{overflow:auto}
  .layout{grid-template-columns:1fr;height:auto}
  .stage{height:62vw;min-height:300px}
  .panel{border-left:0;border-top:1px solid var(--line)}
  .tabbody{overflow:visible}
  .brand span{display:none}
}
@media (max-width:720px){
  .topbar{flex-wrap:wrap;height:auto;padding:10px 16px}
  .banner{top:0}
  .palettes,.themes-grid,.steps{grid-template-columns:1fr}
  .el .top{flex-wrap:wrap}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="var(--accent)" stroke-width="2.5"/><path d="M16 1v8M16 23v8M1 16h8M23 16h8" stroke="var(--accent)" stroke-width="2.5"/></svg>
    <b>STUDIO UI</b>
  </div>
  <div class="chips" id="chips"></div>
  <div class="actions">
    <button class="btn icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
    <button class="btn icon" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
    <label class="switch" title="Save to the game automatically after every change, so you only need to press F11 in Elite"><input type="checkbox" id="auto-save"> Auto-save</label>
    <button class="btn" id="btn-discard" title="Throw away changes you haven't saved">Discard</button>
    <button class="btn primary" id="btn-save" title="Write your colors into Elite (Ctrl+S)">Save to game <span class="count" id="dirty-count">0</span></button>
  </div>
</header>

<main class="layout">
  <section class="stage">
    <div class="preview">
      <svg id="hud" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Preview of your cockpit HUD"></svg>
      <figure id="partpic" hidden><img alt=""><figcaption></figcaption></figure>
      <div class="compare-note" id="compare-note" hidden>Showing the colors currently in the game</div>
    </div>
    <div class="views" id="views" role="tablist" aria-label="Preview page">
      <button data-view="theme" class="active">Cockpit (your theme)</button>
      <button data-view="station">Station menu</button>
      <button data-view="galaxy">Galaxy map</button>
      <button data-view="foot">On foot</button>
      <button data-view="fss">Scanner</button>
      <button data-view="nav">Nav panel (1)</button>
      <button data-view="systems">Systems panel (4)</button>
    </div>
    <div class="stagebar">
      <span class="label" id="hover-label">Point at any part of the HUD to see what it is · click it to edit</span>
      <button class="btn small" id="btn-compare" title="Hold down to see the colors that are in the game right now">Hold to compare</button>
    </div>
  </section>

  <aside class="panel">
    <nav class="tabs" id="tabs">
      <button data-tab="quick" class="active">Quick Theme</button>
      <button data-tab="all">All Settings</button>
      <button data-tab="themes">Themes</button>
      <button data-tab="backups">Backups</button>
      <button data-tab="edhm">Setup</button>
    </nav>
    <div class="tabbody" id="tab-quick"></div>
    <div class="tabbody" id="tab-all" hidden></div>
    <div class="tabbody" id="tab-themes" hidden></div>
    <div class="tabbody" id="tab-backups" hidden></div>
    <div class="tabbody" id="tab-edhm" hidden></div>
  </aside>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div class="banner" id="banner" hidden></div>

// ============================================================ API
async function api(method, path, body) {
  const opt = { method, headers: { 'X-Studio-Token': TOKEN } };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(path, opt); } catch (e) { setHelper(false, 'down'); throw new Error("Can't reach Elite Studio."); }
  let data = null;
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401) { setHelper(false, 'restarted'); throw new Error('Elite Studio was restarted. Please reload this page.'); }
  setHelper(true);
  if (!res.ok || !data || data.ok === false) throw new Error((data && data.error) || ('Request failed (' + res.status + ')'));
  return data;
}
function setHelper(ok, why) {
  if (ok === S.helperOk && ok) return;
  S.helperOk = ok;
  const b = $('#banner');
  if (ok) { b.hidden = true; return; }
  if (window.parent !== window) return;   // inside Elite Studio's shell page, which shows this bar and its Reload button for the whole window
  b.innerHTML = '';
  b.append(why === 'restarted'
    ? h('span', null, 'Elite Studio was restarted. Reload this page to reconnect.')
    : h('span', null, "Can't reach Elite Studio. Start Elite Studio, then reload this page."),
  h('button', { class: 'btn small', onclick: () => location.reload() }, 'Reload'));
  b.hidden = false;
}

function parseIni(text) {
  const out = new Map();
  if (!text) return out;
  const m = /^[ \t]*\[Constants\][^\n]*/im.exec(text);
  if (!m) return out;
  let body = text.slice(m.index + m[0].length);
  const next = /^[ \t]*\[/m.exec(body);
  if (next) body = body.slice(0, next.index);
  const re = /^[ \t]*([xyzw]\d+)[ \t]*=[ \t]*(-?[0-9]*\.?[0-9]+(?:[eE][-+]?[0-9]+)?)/gm;
  let r;
  while ((r = re.exec(body))) if (!out.has(r[1])) out.set(r[1], r[2]);
  return out;
}
// Label for settings that aren't in the catalogue (e.g. added by a future HUD mod version): the comments above the line.
function iniLabels(text) {
  const out = new Map();
  if (!text) return out;
  const lines = text.split(/\r?\n/);
  lines.forEach((line, i) => {
    const m = /^[ \t]*([xyzw]\d+)[ \t]*=/.exec(line);
    if (!m || out.has(m[1])) return;
    let title = '';
    for (let j = i - 1; j >= 0 && j >= i - 14; j--) {
      const c = lines[j].trim();
      if (!c.startsWith(';')) break;
      const t = c.replace(/^;+/, '').trim();
      if (!t || /^[-=*_\s]+$/.test(t) || /^set [xyzw]\d+ value/i.test(t) || /^\d+\s*=/.test(t)) continue;
      const star = /\*\*\s*(.+?)\s*\*\*/.exec(t);
      if (star) { title = star[1]; break; }
      if (!title) title = t;
    }
    out.set(m[1], title || m[1]);
  });
  return out;
}
function setupCatalog(cat) {
  S.presets = cat.presets || {};
  S.groups = cat.groups.map(g => ({ id: g.id, title: g.title, els: g.els.map(e => ({ ...e, keys: [].concat(e.keys), group: g.id })) }));
  for (const g of S.groups) for (const e of g.els) {
    S.els.push(e); S.byId.set(e.id, e);
    if (g.id === 'Prefs') for (const k of e.keys) S.prefKeys.add(e.file + ':' + k);
  }
  for (const g of S.groups) {
    let last = null, cat2 = null;
    for (const e of g.els) {
      if (e.cat !== cat2) { cat2 = e.cat; last = null; }
      if (e.kind === 'mode' && GOVERNING.has(e.type)) last = e;
      else if (e.kind === 'color' && last) S.modeFor.set(e.id, last);
    }

  for (const [c, m] of Object.entries(MODE_OVERRIDES)) if (S.byId.has(c) && S.byId.has(m)) S.modeFor.set(c, S.byId.get(m));
  S.group = S.groups[0].id;
  S.keyEl = new Map();   // "File:key" -> the setting it belongs to
  for (const e of S.els) for (const k of e.keys) S.keyEl.set(e.file + ':' + k, e);
}

  const r = await api('GET', API + '/ini');
  applyIni(r.files || {}, keepEdits);
}
function applyIni(files, keepEdits) {
  S.texts = files;
  for (const f of FILES) S.baseline[f] = parseIni(S.texts[f]);
  if (!keepEdits) {
    for (const f of FILES) S.working[f] = new Map(S.baseline[f]);
    history.undo.length = 0; history.redo.length = 0; pending = null;
  } else {
    for (const f of FILES) {

      for (const [k, v] of b) if (!w.has(k)) w.set(k, v);

    }

  const known = new Set();
  for (const e of S.els) for (const k of e.keys) known.add(e.file + ':' + k);
  S.others = [];
  for (const f of FILES) {
    if (f === 'XML-Profile') continue;
    const labels = iniLabels(S.texts[f]);
    for (const k of S.baseline[f].keys()) if (!known.has(f + ':' + k)) S.others.push({ file: f, key: k, label: labels.get(k) || k });

// ============================================================ themes
function applyValues(values, label, includePrefs) {
  let n = 0;
  for (const f of FILES) {
    const src = values && values[f];
    if (!src) continue;
    const m = S.working[f];
    for (const [k, v] of Object.entries(src)) {
      if (!m || !m.has(k) || (!includePrefs && S.prefKeys.has(f + ':' + k))) continue;
      const num = parseFloat(v);
      if (Number.isFinite(num) && setValue(f, k, num)) n++;
    }
  }
  commit(label);
  afterBulkChange();
  return n;
}
function valuesFromTexts(files) { const v = {}; for (const f of FILES) if (files && files[f]) v[f] = Object.fromEntries(parseIni(files[f])); return v; }
function currentValues() {
  const v = {};
  for (const f of FILES) { const m = S.working[f]; if (!m) continue; v[f] = {}; for (const [k, x] of m) if (!S.prefKeys.has(f + ':' + k)) v[f][k] = x; }
  return v;
}

// ============================================================ saving & top bar
// A colour is stored as 3-4 numbers (red, green, blue, opacity) but counts as ONE setting here.
function dirtySettingsCount() {
  const seen = new Set();
  let n = 0, xml = false;
  for (const e of S.els) if (e.available && isElDirty(e)) { n++; for (const k of e.keys) seen.add(e.file + ':' + k); }
  for (const f of FILES) {
    const m = S.working[f]; if (!m) continue;
    for (const k of m.keys()) if (isKeyDirty(f, k) && !seen.has(f + ':' + k)) { if (f === 'XML-Profile') xml = true; else n++; }
  }
  return n + (xml ? 1 : 0);
}
async function save(opts) {
  opts = opts || {};
  commit();
  const changes = collectChanges();
  const count = Object.values(changes).reduce((a, o) => a + Object.keys(o).length, 0);
  const settings = dirtySettingsCount();
  if (!count) { if (!opts.silent) toast('Nothing to save: the game already has these colors.'); return; }
  if (!S.status || !S.status.edhm || !S.status.edhm.installed) { toast('HUD color files weren’t found in this game, so there’s nowhere to save yet (see the Setup tab).', 'bad'); return; }
  S.saving = true; updateTopbar();
  try {
    const r = await api('POST', API + '/save', { changes });
    await loadFromGame(true);
    refreshRowStates();
    const what = settings === 1 ? '1 setting' : `${settings} settings`;
    const msg = !r.running ? `Saved ${what}. They’ll show the next time you start Elite.`
      : (r.reload && r.reload.sent) ? `Saved ${what} and reloaded Elite (F11 sent).`
      : `Saved ${what}. In Elite, press F11 to reload your HUD colors.`;
    if (r.missing && r.missing.length) toast(`Saved, but ${r.missing.length} setting(s) weren’t found in your color files.`, 'bad');
    else if (!opts.silent || opts.announce) toast(msg, 'good');
    $('#hover-label').textContent = (r.running ? 'Saved to game · press F11 in Elite · ' : 'Saved to game · ') + new Date().toLocaleTimeString();
  } catch (e) {
    toast('Could not save: ' + e.message, 'bad');
  } finally { S.saving = false; updateTopbar(); }
}
function scheduleAutosave() {
  if (!$('#auto-save').checked) return;
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => { if (dirtyCount() && !S.saving) save({ silent: true }); }, 900);
}
function updateTopbar() {

  $('#dirty-count').textContent = n ? dirtySettingsCount() : 0;
  const sb = $('#btn-save');
  sb.title = n ? `${dirtySettingsCount()} changed setting(s) to write into Elite (Ctrl+S)` : 'Nothing to save';
  sb.disabled = S.saving || !n;
  sb.firstChild.textContent = S.saving ? 'Saving… ' : 'Save to game ';
  $('#btn-discard').disabled = !n;
  $('#btn-undo').disabled = !history.undo.length && !pending;
  $('#btn-redo').disabled = !history.redo.length;
  const chips = $('#chips');
  chips.innerHTML = '';
  const st = S.status;
  if (!st) return;
  if (!st.game) chips.append(h('span', { class: 'chip bad' }, h('span', { class: 'dot' }), 'Elite not found'));
  else if (st.running) chips.append(h('span', { class: 'chip on', title: 'After saving, press F11 in Elite to reload the colors' }, h('span', { class: 'dot' }), 'Elite running · save, then press F11'));
  else chips.append(h('span', { class: 'chip', title: 'Saved colors show the next time you start Elite' }, h('span', { class: 'dot' }), 'Elite closed'));
  const e = st.edhm;
  if (st.game && (!e || !e.installed)) chips.append(h('span', { class: 'chip bad', onclick: () => showTab('edhm'), style: 'cursor:pointer' }, h('span', { class: 'dot' }), 'Color files not found'));
  if (st.testMode) chips.append(h('span', { class: 'chip warn' }, h('span', { class: 'dot' }), 'TEST MODE'));
}
async function refreshStatus() {
  try {
    const prev = S.status;
    S.status = await api('GET', API + '/status');
    updateTopbar();
    autoInstallMod();
    if (S.tab === 'edhm' && prev && (prev.running !== S.status.running || (prev.edhm || {}).version !== (S.status.edhm || {}).version || (prev.edhm || {}).installed !== (S.status.edhm || {}).installed)) renderEdhm();
  } catch (e) {}
}
function pollStatus() { refreshStatus().finally(() => setTimeout(pollStatus, document.hidden ? 30000 : 4000)); }

// ============================================================ little UI helpers
let toastTimer = 0;
function toast(msg, kind) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, kind === 'bad' ? 7000 : 4500);
}
function confirmBox({ title, body, ok, cancel }) {
  return new Promise(resolve => {
    const m = h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' });
    const done = v => { m.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') done(false); };
    const okBtn = h('button', { class: 'btn primary', onclick: () => done(true) }, ok || 'OK');
    m.append(h('div', { class: 'box' }, h('h2', null, title), h('div', { class: 'body' }, [].concat(body).map(p => h('p', null, p))),
      h('div', { class: 'foot' }, h('button', { class: 'btn', onclick: () => done(false) }, cancel || 'Cancel'), okBtn)));
    m.addEventListener('click', e => { if (e.target === m) done(false); });
    document.addEventListener('keydown', onKey);
    document.body.append(m);
    okBtn.focus();
  });
}

// ============================================================ diagnostic report
function buildReport() {
  const st = S.status || {}, g = st.game || {}, e = st.edhm || {};
  const lines = [
    'Browser engine: ' + navigator.userAgent,
    'Window: ' + innerWidth + 'x' + innerHeight + ' page pixels, display scaling ' + Math.round(devicePixelRatio * 100) + '%',
    'Elite Studio connected: ' + (S.helperOk ? 'yes' : 'no'),
    '',
    '--- game & color files ---',
    'Game found: ' + (st.game ? 'yes (' + g.store + ', build ' + (g.version || '?') + ')' : 'no'),
    'Game folder: ' + (g.path || '-'),
    'Other installs found: ' + ((st.games || []).length),
    'Elite running: ' + (st.running ? 'yes' : 'no'),
    'Color files: ' + (e.installed ? 'found (version ' + (e.version || '?') + ')' : 'not found' + (e.missing ? ' (missing: ' + e.missing.join(', ') + ')' : '')),
    'Color files folder: ' + (e.iniDir || '-'),
    "Elite's own color file: " + ((st.xml || {}).exists === false ? 'not present (default)' : (st.xml || {}).isDefault ? 'default' : 'custom'),
    '',
    '--- editor ---',
    'Settings loaded: ' + (S.els ? S.els.length : 0) + ', unsaved changes: ' + dirtyCount(),
    'Color files read: ' + FILES.map(f => f + (S.texts && S.texts[f] ? ' ok' : ' MISSING')).join(', '),
    '',
    '--- recent errors on the page ---',
    ERRORS.length ? ERRORS.join('\n') : '(none)'
  ];
  return lines.join('\n');
}
async function saveReport() {
  const text = buildReport();
  try { const d = await api('POST', '/api/app/report', { text }); toast('Report saved: ' + d.path + '. Send that file when asking for help.', 'good'); } catch (e) { toast('Could not save the report: ' + e.message, 'bad'); }
}

// ============================================================ desktop app window
// The page can ask the app for a real folder picker (it opens on this PC, also when the page is in a browser).
function pickGameFolder() {
  return api('POST', '/api/app/pick-folder', {}).then(d => d.path || null, e => { toast(e.message, 'bad'); return null; });
}
async function useGameFolder(path) {
  if (!path) return false;
  if (path[0] === '?') { toast(linux() ? 'That folder doesn’t contain Elite Dangerous (EliteDangerous64.exe). Choose the “Elite Dangerous” folder or …/Products/elite-dangerous-odyssey-64.'
    : 'That folder doesn’t contain Elite Dangerous (EliteDangerous64.exe). Choose the “Elite Dangerous” folder or …\\Products\\elite-dangerous-odyssey-64.', 'bad'); return false; }
  try {
    S.status = await api('POST', API + '/select-game', { path });
    await loadFromGame(false); afterBulkChange(); updateTopbar();
    if (S.tab === 'edhm') renderEdhm();
    toast('Using Elite Dangerous in ' + path, 'good');   // the app saves this choice in settings.json
    return true;
  } catch (x) { toast(x.message, 'bad'); return false; }
}
async function browseForGame() { return useGameFolder(await pickGameFolder()); }

// What this copy of Studio has (GET /api/ping's "features", as studio.js reads it for the other pages). Empty until the
// app has said. An app too old to say, or no answer, reads as the Windows app (as in studio.js), so Windows never loses
// the HUD mod's automatic install; but where the web engine itself names Linux (the Linux window's does, Windows' never
// does), no answer reads as Linux, so Linux never installs the mod by itself. On Linux the page says "Trash", the
// Setup tab carries the notes below, and a link that would open a second window goes to the player's own web browser
// through the app (the Linux window opens none; POST /api/app/open takes http and https only).
let has = {}, hasKnown = false;   // hasKnown: the app has answered, or could not (autoInstallMod waits for it)
const linux = () => has.system === 'linux';
function loadFeatures() {
  fetch('/api/ping').then(r => r.json()).then(r => r && r.features, () => null).then(features => {
    has = features || (/Linux/.test(navigator.userAgent) ? { system: 'linux' } : {});
    hasKnown = true;
    if (!linux()) return;
    document.addEventListener('click', e => {
      const a = e.target.closest && e.target.closest('a[target="_blank"]');
      if (!a || !/^https?:/i.test(a.href)) return;
      e.preventDefault();
      api('POST', '/api/app/open', { url: a.href }).catch(x => toast(x.message, 'bad'));
    }, true);
    if (S.tab === 'edhm') renderEdhm();
  }).catch(() => {});
}
// The Setup tab on Linux: what to know about the HUD mod there, and where Studio reads the game from (Elite's journal
// folder, found in Steam's Proton folders when Studio starts, or the one chosen here), with a way to choose another.
// A folder chosen is kept by the app and used from its next start.
let journalChosen = '';
function linuxCards(box) {
  box.append(h('div', { class: 'card note' }, h('p', { class: 'small', style: 'margin:0' },
    'On Linux, press F11 in the game to load new colors. The HUD mod does not work with Proton 11 yet: in Steam, set Elite to use Proton 10.')));
  const line = h('p', { class: 'small' }, h('span', { class: 'spin' }), ' Asking Elite Studio…');
  const chosen = h('p', { class: 'small muted', style: 'margin:10px 0 0' });
  const showChosen = () => { chosen.textContent = 'Used from the next start: ' + journalChosen; chosen.hidden = !journalChosen; };
  showChosen();
  // The app says only whether the folder is there. One that is not, inside Steam's Proton folder for Elite, is the place
  // Studio found itself (with nothing found it reads an empty folder of its own): the game has not been started yet.
  const waiting = d => /\/drive_c\/users\/[^/]+\/Saved Games\/Frontier Developments\/Elite Dangerous$/.test(d.path);
  api('GET', '/api/app/journal').then(d => line.replaceChildren(...(d.found ? ['Studio reads your game from: ', h('span', { class: 'muted' }, d.path)]
    : waiting(d) ? ['Elite makes its journal folder the first time you start the game, so it is not there yet. Studio found where it will be, in Steam’s files for Elite, and reads your game from there by itself: ', h('span', { class: 'muted' }, d.path)]
    : ['Studio did not find Elite’s journal folder, so it cannot see your game. Choose the folder that holds Elite’s journal files: in the Proton folder Steam keeps for Elite, it is drive_c/users/steamuser/Saved Games/Frontier Developments/Elite Dangerous.'])),
    () => line.replaceChildren('Studio could not say which folder it reads your game from.'));
  const pick = async () => {
    let d;
    try { d = await api('POST', '/api/app/pick-journal', {}); } catch (e) { toast(e.message, 'bad'); return; }
    if (!d.path) return;   // closed without choosing
    journalChosen = d.path;
    showChosen();
  };
  box.append(h('div', { class: 'card' }, h('h2', null, 'Where Studio reads your game'), line,
    h('div', { class: 'row-actions' }, h('button', { class: 'btn small', onclick: pick }, 'Choose another folder')), chosen));
}
// First start: confirm the game Elite Studio found, or help find it. The answer is kept in Studio's
// settings.json (by the app), so it's asked once, not every launch.
async function firstRunGameCheck() {
  const st = S.status || {}, g = st.game;
  if (g && st.gameConfirmed) return;
  if (g) {
    const ok = await confirmBox({ title: 'Is this your Elite Dangerous?', body: [`Elite Studio found the game (${g.store}) here:`, g.path, 'Your colors are saved into this game’s HUD color files.'], ok: 'Yes, use it', cancel: 'Choose another folder…' });
    if (ok) { try { S.status = await api('POST', API + '/confirm-game', {}); autoInstallMod(); } catch (e) { toast(e.message, 'bad'); } return; }
    await browseForGame();
  } else {
    const ok = await confirmBox({ title: 'Find Elite Dangerous', body: ['Elite Studio couldn’t find Elite Dangerous on this PC.', 'Click Browse and choose your Elite Dangerous folder.', 'You can still design colors and save themes without it.'], ok: 'Browse…', cancel: 'Later' });
    if (!ok) return;
    await browseForGame();
  }
}

// ============================================================ start-up
function wireTopbar() {
  $('#btn-save').addEventListener('click', () => save({ announce: true }));
  $('#btn-undo').addEventListener('click', undo);
  $('#btn-redo').addEventListener('click', redo);
  $('#btn-discard').addEventListener('click', async () => {
    const n = dirtyCount();
    if (!n || !await confirmBox({ title: 'Discard unsaved changes?', body: [`${n} setting(s) go back to what is in the game now. You can still undo this with Ctrl+Z.`], ok: 'Discard' })) return;
    for (const f of FILES) for (const [k, v] of S.baseline[f]) setValue(f, k, parseFloat(v));
    commit('Discard changes');
    afterBulkChange();
  });
  const auto = $('#auto-save');
  auto.checked = store.get('autosave', false);
  auto.addEventListener('change', () => { store.set('autosave', auto.checked); if (auto.checked) { toast('Auto-save is on: every change goes straight to the game. Press F11 in Elite to see it.'); scheduleAutosave(); } });
  for (const b of $$('#tabs button')) b.addEventListener('click', () => showTab(b.dataset.tab));
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && !/^(color|range|checkbox)$/.test(document.activeElement.type);
    if (k === 's') { e.preventDefault(); save({ announce: true }); }
    else if (k === 'z' && !typing) { e.preventDefault(); if (e.shiftKey) redo(); else undo(); }
    else if (k === 'y' && !typing) { e.preventDefault(); redo(); }
  });
  window.addEventListener('beforeunload', e => { if (dirtyCount()) { e.preventDefault(); e.returnValue = ''; } });
  // Coming back from the game: if the color files were changed by something else and you have no
  // unsaved edits, show what is really in the game. Any edit made while checking wins.
  // (Not before start-up has read the color files once: the shell page gives this page the focus as soon as it loads.)
  window.addEventListener('focus', async () => {
    if (!S.baseline[FILES[0]] || !S.helperOk || S.saving || dirtyCount() || pending) return;
    const gen = S.editGen;
    try {
      const r = await api('GET', API + '/ini');
      if (gen !== S.editGen || S.saving || dirtyCount() || pending) return;
      const files = r.files || {};
      if (FILES.every(f => (files[f] || '') === (S.texts[f] || ''))) return;
      applyIni(files, false);
      afterBulkChange();
      toast('Your HUD color files changed outside Studio UI, so the editor was refreshed.');
    } catch (e) {}
  });
}
async function init() {
  if (!IN_APP) { $('#cover-nohelper').hidden = false; return; }
  loadFeatures();
  buildHud();
  setupPreviewEvents();
  wireTopbar();
  try {
    const file = name => fetch(name, { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(name + ' is missing'); return r.json(); });
    const [cat, st] = await Promise.all([file('catalog.json'), api('GET', API + '/status')]);
    S.status = st;
    setupCatalog(cat);
    await loadDefaults();
    await loadFromGame(false);
  } catch (e) {
    toast('Could not start: ' + e.message, 'bad');
    return;
  }
  renderPreview();
  updateTopbar();
  showTab('quick');
  setTimeout(pollStatus, 4000);
  firstRunGameCheck();
}
init();
})();
</script>
</body>
