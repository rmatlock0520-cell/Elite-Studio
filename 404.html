<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/Elite-Studio/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box;
  background: radial-gradient(ellipse 120% 70% at 50% 0%, #2c0b63, #0b0221 65%); color: #f3ecff; font: 400 1.1rem/1.6 "Exo 2", "Segoe UI", system-ui, sans-serif; }
h1 { font: 900 clamp(2.6rem, 11vw, 5.4rem)/1 "Orbitron", "Segoe UI", sans-serif; letter-spacing: .08em; color: #ff3fa4; margin: 0 0 14px;
  text-shadow: 0 0 4px #fff, 0 0 18px #ff3fa4, 0 0 40px #ff3fa4; }
p { margin: 0 0 10px; }
a { display: inline-block; margin-top: 14px; padding: 12px 24px; border-radius: 999px; border: 2px solid #3ff5ff; color: #fff; text-decoration: none;
  font: 900 .9rem "Orbitron", sans-serif; letter-spacing: .1em; text-transform: uppercase; box-shadow: 0 0 16px #3ff5ff; text-shadow: 0 0 8px #3ff5ff; }
a:hover { background: rgba(63, 245, 255, .18); }
.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }
</style>
</head>

<main>
  <h1>GAME OVER</h1>
